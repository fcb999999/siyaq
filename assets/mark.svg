<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="frame" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%"   stop-color="#1fd6c4"/>
      <stop offset="45%"  stop-color="#3d7bf0"/>
      <stop offset="100%" stop-color="#7c5cf0"/>
    </linearGradient>
    <linearGradient id="orbit" gradientUnits="userSpaceOnUse" x1="96" y1="0" x2="416" y2="0">
      <stop offset="0%"   stop-color="#1fd6c4"/>
      <stop offset="50%"  stop-color="#5b6ef2"/>
      <stop offset="100%" stop-color="#f59e42"/>
    </linearGradient>
    <linearGradient id="cTeal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2ee0cf"/>
      <stop offset="100%" stop-color="#13a598"/>
    </linearGradient>
    <linearGradient id="cBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5f83f8"/>
      <stop offset="100%" stop-color="#3550c7"/>
    </linearGradient>
    <linearGradient id="cOrange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf6b"/>
      <stop offset="100%" stop-color="#ef8b2c"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- الخلفية -->
  <rect x="0" y="0" width="512" height="512" rx="96" fill="#0e1728"/>

  <!-- الإطار الخارجي -->
  <rect x="86" y="132" width="340" height="196" rx="42" ry="42"
        fill="none" stroke="url(#frame)" stroke-width="19"/>

  <!-- المدار خلف البطاقات -->
  <path d="M 96 300 C 120 372, 392 372, 416 300"
        fill="none" stroke="url(#orbit)" stroke-width="15" stroke-linecap="round" opacity="0.95"/>

  <!-- البطاقات الثلاث -->
  <g filter="url(#soft)">
    <!-- صورة -->
    <rect x="140" y="160" width="80" height="140" rx="12" fill="url(#cTeal)"/>
    <circle cx="167" cy="196" r="12" fill="#c9fff9" opacity="0.92"/>
    <path d="M 150 282 L 176 236 L 196 268 L 208 250 L 212 282 Z" fill="#0d5f58" opacity="0.55"/>

    <!-- فيديو -->
    <rect x="222" y="152" width="82" height="156" rx="12" fill="url(#cBlue)"/>
    <path d="M 250 200 L 288 230 L 250 260 Z" fill="#e8eefc"/>

    <!-- مستند -->
    <rect x="306" y="160" width="78" height="140" rx="12" fill="url(#cOrange)"/>
    <path d="M 358 160 L 384 186 L 358 186 Z" fill="#0e1728" opacity="0.18"/>
    <g fill="#8a4b12" opacity="0.55">
      <rect x="320" y="206" width="50" height="7" rx="3.5"/>
      <rect x="320" y="224" width="50" height="7" rx="3.5"/>
      <rect x="320" y="242" width="50" height="7" rx="3.5"/>
      <rect x="320" y="260" width="32" height="7" rx="3.5"/>
    </g>
  </g>

  <!-- المدار أمام البطاقات + النقاط -->
  <path d="M 416 300 C 421 264, 412 240, 396 228"
        fill="none" stroke="url(#orbit)" stroke-width="15" stroke-linecap="round" opacity="0.9"/>
  <path d="M 96 300 C 91 264, 100 240, 116 228"
        fill="none" stroke="url(#orbit)" stroke-width="15" stroke-linecap="round" opacity="0.9"/>

  <circle cx="196" cy="352" r="13" fill="#1fd6c4"/>
  <circle cx="256" cy="360" r="13" fill="#5b6ef2"/>
  <circle cx="318" cy="352" r="13" fill="#f59e42"/>
  <path d="M 209 352 L 243 358 M 269 359 L 305 353"
        stroke="#5b6ef2" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
</svg>
